<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111015">
  <title>Rooms — a place that feels like you</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><a href="#home" class="wordmark" aria-label="Rooms home"><span class="logo-mark">⌂</span> rooms<span class="wordmark-period">.</span></a><nav class="main-nav"><button class="nav-item active" data-page="feed">Discover</button><button class="nav-item" data-page="myroom">My room</button></nav><div class="top-actions"><button class="search-open" id="searchOpen" aria-label="Search">⌕ <span>Search rooms</span></button><div class="user-menu" id="userMenu"><span class="tiny-avatar" id="navAvatar">G</span><span id="navName">Guest</span><button id="authButton" class="button button-small">Sign in</button></div></div></header>
  <main class="shell"><aside class="sidebar"><div class="side-label">YOUR SPACE</div><button class="side-link active" data-page="feed"><span>✳</span> Discover</button><button class="side-link" data-page="myroom"><span>⌂</span> My room <span class="side-count">↗</span></button><div class="side-label side-label-gap">COMMUNITY</div><button class="side-link" data-page="feed" data-filter="following"><span>♡</span> Following</button><button class="side-link" data-page="feed" data-filter="popular"><span>✧</span> Popular rooms</button><div class="side-card"><div class="side-card-icon">✿</div><strong>Make it yours</strong><p>Build a little corner of the internet that feels like you.</p><button class="text-button" data-page="myroom">Customize room <span>→</span></button></div><div class="sidebar-bottom">A softer corner of the internet<br><span>ROOMS COMMUNITY · 2025</span></div></aside>
    <section class="main-content" id="mainContent" aria-live="polite"></section>
  </main>
  <div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div><div class="toast" id="toast" role="status"></div>
  <script>
  (()=>{
    const KEY='rooms-community-v1';
    const seed={currentUser:null,users:[]};
    let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed}catch{state=seed}
    if(!state||!Array.isArray(state.users))state=seed;
    // Remove the original bundled showcase accounts from browsers that loaded an earlier demo build.
    const showcaseIds=new Set(['mira','rowan','pixel','juniper']);
    state.users=state.users.filter(u=>!showcaseIds.has(u.id));
    if(showcaseIds.has(state.currentUser))state.currentUser=null;
    if(localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify(state));
    const $=s=>document.querySelector(s), main=$('#mainContent');let activePage='feed',roomId=null,searchTerm='',feedFilter='all';
    const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const current=()=>state.users.find(u=>u.id===state.currentUser)||null;
    const userBy=id=>state.users.find(u=>u.id===id);
    const initials=name=>(name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    function avatarHTML(u,cls='avatar'){return u?.avatar?`<img class="${cls}" src="${escAttr(u.avatar)}" alt="${esc(u.name)} avatar" onerror="this.outerHTML='<span class=&quot;${cls} avatar-fallback&quot;>${initials(u.name)}</span>'">`:`<span class="${cls} avatar-fallback" aria-label="${escAttr(u?.name||'Guest')} avatar">${initials(u?.name||'Guest')}</span>`}
    function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(v=''){return esc(v)}
    function themeVars(u){let t=u.theme;let bg=t.image?`url("${escAttr(t.image)}") center/cover fixed`:t.background;return `--room-bg:${bg};--room-primary:${t.primary};--room-accent:${t.accent};--room-text:${t.text};--room-border:${t.border};--room-font:${fontStack(t.font)}`}
    function fontStack(f){return ({serif:"'Playfair Display',serif",modern:"'DM Sans',sans-serif",gothic:"'Playfair Display',serif",cyberpunk:"'DM Mono',monospace",retro:"'Special Elite',serif"})[f]||"'DM Sans',sans-serif"}
    function go(page,id=null){activePage=page;roomId=id;let target=page==='room'?`#/room/${encodeURIComponent(userBy(id)?.handle||id)}`:`#/${page}`;if(location.hash!==target)history.pushState(null,'',target);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page&&(!id||b.closest('.sidebar')===null)));render()}
    function syncRoute(){let path=decodeURIComponent(location.hash.replace(/^#\/?/,''));if(path.startsWith('room/')){let handle=path.slice(5).toLowerCase(),u=state.users.find(x=>x.handle.toLowerCase()===handle||x.id===handle);activePage='room';roomId=u?.id||null}else if(path==='myroom'){activePage='myroom';roomId=null}else{activePage='feed';roomId=null}render()}
    function render(){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));document.querySelectorAll('.sidebar [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));if(activePage==='room')renderRoom(userBy(roomId));else if(activePage==='myroom'){let u=current();if(u)renderRoom(u,true);else renderWelcome()}else renderFeed();updateNav()}
    function updateNav(){let u=current();$('#navName').textContent=u?u.name:'Guest';$('#navAvatar').textContent=initials(u?.name||'Guest');$('#authButton').textContent=u?'Sign out':'Sign in';$('#navAvatar').classList.toggle('has-image',!!u?.avatar);if(u?.avatar)$('#navAvatar').style.backgroundImage=`url("${escAttr(u.avatar)}")`;else $('#navAvatar').style.backgroundImage='none'}
    function renderFeed(){document.body.removeAttribute('style');main.innerHTML=`<div class="feed-heading"><div><div class="kicker">A place that feels like you</div><h1>Find your corner.</h1><p>Meet the people making little worlds of their own.</p></div><button class="button create-button" id="createPost">＋ <span>Make a post</span></button></div><div class="feed-controls"><div class="feed-tabs"><button class="feed-tab ${feedFilter==='all'?'selected':''}" data-feed="all">For you</button><button class="feed-tab ${feedFilter==='following'?'selected':''}" data-feed="following">Following</button><button class="feed-tab ${feedFilter==='popular'?'selected':''}" data-feed="popular">Popular</button></div><label class="search-field">⌕ <input id="roomSearch" placeholder="Find a room or a person…" value="${escAttr(searchTerm)}"></label></div><div class="feed-list" id="feedList"></div>`;
      let all=[];state.users.forEach(u=>u.posts.forEach(p=>all.push({u,p})));if(feedFilter==='following'){let me=current();all=all.filter(x=>me?.following?.includes(x.u.id))}if(feedFilter==='popular')all.sort((a,b)=>b.p.likes-a.p.likes);else all.sort((a,b)=>b.p.id.localeCompare(a.p.id));let q=searchTerm.toLowerCase();all=all.filter(x=>!q||`${x.u.name} ${x.u.handle} ${x.p.text}`.toLowerCase().includes(q));$('#feedList').innerHTML=all.length?all.map(({u,p})=>postHTML(u,p,true)).join(''):`<div class="empty-state"><span>✿</span><h3>${feedFilter==='following'?'Your circle is quiet':'No rooms found'}</h3><p>${feedFilter==='following'?'Follow a room to see their posts here.':'Try another search, or be the first to make a post.'}</p><button class="button" data-page="myroom">${current()?'Post something':'Create your room'}</button></div>`;
      $('[data-feed="all"]').onclick=()=>{feedFilter='all';renderFeed()};$('[data-feed="following"]').onclick=()=>{feedFilter='following';renderFeed()};$('[data-feed="popular"]').onclick=()=>{feedFilter='popular';renderFeed()};$('#roomSearch').oninput=e=>{searchTerm=e.target.value;let pos=e.target.selectionStart;renderFeed();$('#roomSearch').focus();$('#roomSearch').setSelectionRange(pos,pos)};$('#createPost').onclick=()=>current()?openPostModal():openAuth();bindPostButtons();main.querySelectorAll('[data-page="myroom"]').forEach(b=>b.onclick=()=>go('myroom'))}
    function postHTML(u,p,feed=false){let liked=p.likedBy?.includes(state.currentUser);return `<article class="post-card"><div class="post-header">${avatarHTML(u,'post-avatar')}<div class="post-author"><button class="author-name" data-room="${u.id}">${esc(u.name)}</button><span>@${esc(u.handle)} <i>·</i> ${esc(p.time||'just now')}</span></div><button class="more-button" title="Open room" data-room="${u.id}">···</button></div>${p.text?`<p class="post-copy">${esc(p.text)}</p>`:''}${p.type==='image'&&p.image?`<img class="post-image" src="${escAttr(p.image)}" alt="Post by ${escAttr(u.name)}" loading="lazy">`:''}${p.type==='gallery'&&p.images?.length?`<div class="post-gallery ${p.images.length===1?'one-image':''}">${p.images.slice(0,4).map(src=>`<img src="${escAttr(src)}" alt="Gallery image" loading="lazy">`).join('')}</div>`:''}<div class="post-actions"><button class="like-button ${liked?'liked':''}" data-like="${u.id}:${p.id}">${liked?'♥':'♡'} <span>${p.likes||0}</span></button><button class="comment-jump" data-room="${u.id}">○ <span>${u.comments.length} ${u.comments.length===1?'note':'notes'}</span></button><button class="share-button" data-share="${u.id}">↗ <span>Visit room</span></button></div></article>`}
    function bindPostButtons(){main.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>go('room',b.dataset.room));main.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{if(!current()){openAuth();return}let [id,pid]=b.dataset.like,u=userBy(id),p=u.posts.find(x=>x.id===pid);p.likedBy??=[];if(p.likedBy.includes(state.currentUser)){p.likedBy=p.likedBy.filter(x=>x!==state.currentUser);p.likes--}else{p.likedBy.push(state.currentUser);p.likes++}save();renderFeed()});main.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>go('room',b.dataset.share))}
    function renderWelcome(){main.innerHTML=`<div class="welcome-card"><div class="welcome-copy"><div class="kicker">Your space is waiting</div><h1>Make a room<br>of your own.</h1><p>Pick your colors, set the mood, and build a little place to call yours. No rules, just you.</p><button class="button create-button" id="welcomeAuth">Get started <span>→</span></button></div><div class="welcome-art"><span class="orb orb-one"></span><span class="orb orb-two"></span><div class="welcome-window"><span>your room</span><div>✿</div><small>a little bit of you</small></div></div></div><div class="welcome-foot"><span>✦</span> Your room, your rules. Always.</div>`;$('#welcomeAuth').onclick=openAuth}
    function renderRoom(u,owner=false){if(!u){renderWelcome();return}document.body.style.cssText=themeVars(u)+';background:var(--room-bg);color:var(--room-text)';let isOwner=owner&&current()?.id===u.id;let followed=current()?.following?.includes(u.id);let w=u.theme.widgets;main.innerHTML=`<div class="room-toolbar"><button class="back-link" id="backFeed">← <span>Back to discover</span></button>${isOwner?`<button class="button button-small" id="editRoom">✎ Customize room</button>`:`<button class="button button-small follow-room ${followed?'following':''}" id="followRoom">${followed?'✓ Following':'＋ Follow'}</button>`}</div><div class="room-page" style="${themeVars(u)}"><header class="room-cover"><div class="cover-shimmer"></div><span class="room-sign">${esc(u.handle)}'s room</span><div class="room-profile">${avatarHTML(u,'room-avatar')}<div class="room-heading"><h1>${esc(u.name)}</h1><span>@${esc(u.handle)}</span></div>${isOwner?'<span class="owner-label">YOUR ROOM</span>':''}</div></header><div class="room-grid"><div class="room-main"><section class="room-section room-posts"><div class="section-title"><div><div class="kicker">THE ROOM</div><h2>Little updates</h2></div>${isOwner?'<button class="icon-button" id="roomPost">＋</button>':''}</div>${u.posts.length?u.posts.map(p=>roomPostHTML(u,p)).join(''):'<div class="room-empty">Nothing here yet. Add your first post ✿</div>'}</section>${w.guestbook?`<section class="room-section"><div class="section-title"><div><div class="kicker">LEAVE A LITTLE NOTE</div><h2>Guestbook <span class="count-pill">${u.comments.length}</span></h2></div></div><div class="guest-form">${avatarHTML(current()||{name:'Guest'},'guest-avatar')}<textarea id="guestComment" placeholder="Say something kind…" ${current()?'':'disabled'}></textarea><button class="button button-small" id="sendComment">Sign ✦</button></div><div class="comments-list">${u.comments.slice().reverse().map(c=>`<article class="comment">${avatarHTML({name:c.name,avatar:c.avatar||''},'comment-avatar')}<div><strong>${esc(c.name)}</strong><span>${esc(c.time||'just now')}</span><p>${esc(c.text)}</p></div></article>`).join('')||'<p class="quiet-note">The first note could be yours.</p>'}</div></section>`:''}</div><aside class="room-aside">${w.about?`<section class="room-section about-widget"><div class="kicker">A LITTLE ABOUT ME</div><p>${esc(u.bio||'Still figuring out what to say here…')}</p></section>`:''}${w.links?`<section class="room-section links-widget"><div class="kicker">ELSEWHERE</div>${u.links.length?u.links.map(l=>`<a href="${safeURL(l.url)}" target="_blank" rel="noreferrer">${esc(l.label)} <span>↗</span></a>`).join(''):'<p class="quiet-note">Links coming soon.</p>'}</section>`:''}${w.gallery?`<section class="room-section mini-gallery"><div class="kicker">ON THE WALL</div><div>${u.posts.filter(p=>p.image||p.images).slice(0,4).map(p=>`<img src="${escAttr(p.image||p.images[0])}" alt="Room gallery image">`).join('')||'<p class="quiet-note">Your gallery will fill as you post.</p>'}</div></section>`:''}${w.music&&u.theme.music?`<section class="room-section music-widget"><div class="kicker">NOW PLAYING</div><audio controls src="${escAttr(u.theme.music)}"></audio></section>`:''}<div class="room-signoff">✦ <span>thanks for stopping by</span> ✦</div></aside></div></div>`;
      $('#backFeed').onclick=()=>go('feed');if(isOwner)$('#editRoom').onclick=()=>openCustomize(u);if(!isOwner)$('#followRoom').onclick=()=>follow(u.id);$('#sendComment').onclick=()=>comment(u);if(isOwner)$('#roomPost').onclick=()=>openPostModal();main.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>likeOnRoom(u,b.dataset.like));}
    function roomPostHTML(u,p){let liked=p.likedBy?.includes(state.currentUser);return `<article class="room-post">${p.text?`<p>${esc(p.text)}</p>`:''}${p.image?`<img src="${escAttr(p.image)}" alt="Room post" loading="lazy">`:''}${p.images?`<div class="room-post-gallery">${p.images.map(i=>`<img src="${escAttr(i)}" alt="Gallery post" loading="lazy">`).join('')}</div>`:''}<div class="room-post-foot"><span>${esc(p.time||'just now')}</span><button class="like-button ${liked?'liked':''}" data-like="${p.id}">${liked?'♥':'♡'} ${p.likes||0}</button></div></article>`}
    function follow(id){let me=current();if(!me){openAuth();return}me.following??=[];me.following.includes(id)?me.following=me.following.filter(x=>x!==id):me.following.push(id);save();renderRoom(userBy(id));toast(me.following.includes(id)?'Following this room ✦':'Unfollowed room')}
    function likeOnRoom(u,pid){let me=current();if(!me){openAuth();return}let p=u.posts.find(x=>x.id===pid);p.likedBy??=[];if(p.likedBy.includes(me.id)){p.likedBy=p.likedBy.filter(x=>x!==me.id);p.likes--}else{p.likedBy.push(me.id);p.likes++}save();renderRoom(u,u.id===me.id)}
    function comment(u){let me=current();if(!me){openAuth();return}let t=$('#guestComment').value.trim();if(!t){toast('Write a little note first.');return}u.comments.push({name:me.name,avatar:me.avatar,text:t,time:'just now'});save();renderRoom(u,u.id===me.id);toast('Your note is in the guestbook ✦')}
    function openAuth(){modal(`<div class="modal-kicker">WELCOME IN</div><h2>Make yourself at home.</h2><p class="modal-desc">Create a profile or return to your room. This demo saves everything in this browser.</p><form id="authForm"><label class="field-label">Display name<input required id="authName" maxlength="32" placeholder="What should we call you?"></label><label class="field-label">Your handle<input required id="authHandle" maxlength="20" placeholder="e.g. moonflower"></label><button class="button full-button" type="submit">Create my room <span>→</span></button></form><p class="modal-footnote">Already have a room? Enter the same handle to sign back in.</p>`);$('#authForm').onsubmit=e=>{e.preventDefault();let name=$('#authName').value.trim(),handle=$('#authHandle').value.trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9_]/g,'');if(!handle)return toast('Please choose a valid handle.');let u=state.users.find(x=>x.handle.toLowerCase()===handle);if(!u){u={id:handle,name,handle,bio:'A little about me…',avatar:'',theme:{background:'linear-gradient(135deg,#e9e2d7,#c6d5ce)',image:'',primary:'#597867',accent:'#d48b75',text:'#292b29',border:'#89a395',font:'modern',widgets:{about:true,gallery:true,guestbook:true,links:true,music:false},music:''},links:[],posts:[],comments:[],following:[]};state.users.push(u)}else if(name)u.name=name;state.currentUser=u.id;save();closeModal();updateNav();go('myroom');toast(`Welcome to your room, ${u.name} ✦`)}}
    function openCustomize(u){let t=u.theme,w=t.widgets,linkText=u.links.map(l=>`${l.label} | ${l.url}`).join('\n');modal(`<div class="modal-kicker">ROOM CONTROLS</div><h2>Make it feel like you.</h2><p class="modal-desc">Your changes preview on your room as soon as you save.</p><form id="customForm"><div class="form-grid"><label class="field-label">Display name<input id="cName" value="${escAttr(u.name)}" maxlength="32"></label><label class="field-label">Handle<input id="cHandle" value="${escAttr(u.handle)}" maxlength="20"></label><label class="field-label wide-field">Avatar image URL <small>Leave empty for initials avatar</small><input id="cAvatar" value="${escAttr(u.avatar)}" placeholder="https://…"></label><label class="field-label wide-field">About me<textarea id="cBio" maxlength="240">${esc(u.bio)}</textarea></label><label class="field-label wide-field">Favorite links <small>One per line: label | https://address</small><textarea id="cLinks" placeholder="Portfolio | https://example.com">${esc(linkText)}</textarea></label><label class="field-label wide-field">Background image URL <small>Optional. Overrides the color or gradient.</small><input id="cImage" value="${escAttr(t.image||'')}" placeholder="https://…"></label><label class="field-label wide-field">Background color or CSS gradient<input id="cBackground" value="${escAttr(t.background)}"></label><label class="field-label">Primary color<input id="cPrimary" type="color" value="${escAttr(t.primary)}"></label><label class="field-label">Accent color<input id="cAccent" type="color" value="${escAttr(t.accent)}"></label><label class="field-label">Text color<input id="cText" type="color" value="${escAttr(t.text)}"></label><label class="field-label">Border color<input id="cBorder" type="color" value="${escAttr(t.border)}"></label><label class="field-label wide-field">Font preset<select id="cFont"><option value="modern">Modern sans-serif</option><option value="serif">Soft serif</option><option value="gothic">Gothic</option><option value="cyberpunk">Cyberpunk</option><option value="retro">Retro typewriter</option></select></label><label class="field-label wide-field">Music / audio URL<input id="cMusic" value="${escAttr(t.music||'')}" placeholder="https://…/track.mp3"></label></div><div class="widget-title">SHOW ON YOUR ROOM</div><div class="widget-toggles">${[['about','About me'],['gallery','Art gallery'],['guestbook','Guestbook'],['links','Favorite links'],['music','Music player']].map(([k,l])=>`<label><input type="checkbox" id="w_${k}" ${w[k]?'checked':''}> ${l}</label>`).join('')}</div><div class="modal-actions"><button type="button" class="button button-quiet" id="cancelCustom">Cancel</button><button class="button" type="submit">Save room ✦</button></div></form>`);$('#cFont').value=t.font;$('#customForm').onsubmit=e=>{e.preventDefault();let handle=$('#cHandle').value.trim().replace(/^@/,'').toLowerCase().replace(/[^a-z0-9_]/g,'');let conflict=state.users.find(x=>x.handle===handle&&x.id!==u.id);if(!handle||conflict){toast(conflict?'That handle is already taken.':'Choose a valid handle.');return}u.name=$('#cName').value.trim()||u.name;u.handle=handle;u.avatar=$('#cAvatar').value.trim();u.bio=$('#cBio').value.trim();u.links=$('#cLinks').value.split('\n').map(row=>{let [label,...url]=row.split('|');return{label:label.trim(),url:url.join('|').trim()}}).filter(x=>x.label&&x.url);Object.assign(t,{image:$('#cImage').value.trim(),background:$('#cBackground').value.trim()||'#ded8cf',primary:$('#cPrimary').value,accent:$('#cAccent').value,text:$('#cText').value,border:$('#cBorder').value,font:$('#cFont').value,music:$('#cMusic').value.trim()});for(let k of ['about','gallery','guestbook','links','music'])w[k]=$('#w_'+k).checked;save();closeModal();updateNav();renderRoom(u,true);toast('Your room has been updated ✦')};$('#cancelCustom').onclick=closeModal}
    function openPostModal(){if(!current()){openAuth();return}modal(`<div class="modal-kicker">A ROOM UPDATE</div><h2>Put something out there.</h2><p class="modal-desc">Share a thought, a picture, or a few images together.</p><form id="postForm"><label class="field-label">Post text<textarea id="postText" maxlength="600" placeholder="What's on your mind?"></textarea></label><label class="field-label">Image URL <small>Optional</small><input id="postImage" placeholder="https://…"></label><label class="field-label">Gallery image URLs <small>Optional, comma-separated</small><input id="postImages" placeholder="https://image-1.jpg, https://image-2.jpg"></label><div class="modal-actions"><button type="button" class="button button-quiet" id="cancelPost">Cancel</button><button class="button" type="submit">Share post ✦</button></div></form>`);$('#cancelPost').onclick=closeModal;$('#postForm').onsubmit=e=>{e.preventDefault();let text=$('#postText').value.trim(),image=$('#postImage').value.trim(),images=$('#postImages').value.split(',').map(x=>x.trim()).filter(Boolean);if(!text&&!image&&!images.length){toast('Add a thought or an image first.');return}let p={id:'p'+Date.now(),type:images.length?'gallery':image?'image':'text',text,likes:0,likedBy:[],time:'just now'};if(image)p.image=image;if(images.length)p.images=images;current().posts.unshift(p);save();closeModal();if(activePage==='myroom')renderRoom(current(),true);else renderFeed();toast('Your post is out in the world ✦')}}
    function safeURL(url){try{let u=new URL(url);return ['http:','https:'].includes(u.protocol)?escAttr(u.href):'#'}catch{return '#'}}
    function modal(content){$('#modal').innerHTML=`<button class="modal-close" id="closeModal" aria-label="Close">×</button>${content}`;$('#modalBackdrop').classList.add('visible');$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()}}
    function closeModal(){$('#modalBackdrop').classList.remove('visible')}function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
    document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#authButton').onclick=()=>{if(current()){state.currentUser=null;save();updateNav();render();toast('Signed out. See you soon ✦')}else openAuth()};$('#searchOpen').onclick=()=>{go('feed');setTimeout(()=>$('#roomSearch')?.focus(),30)};window.addEventListener('hashchange',syncRoute);window.addEventListener('popstate',syncRoute);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key==='/'){e.preventDefault();$('#searchOpen').click()}});
    if(location.hash)syncRoute();else render();
  })();
  </script>
</body>
</html>
